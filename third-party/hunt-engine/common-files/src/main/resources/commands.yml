# https://github.com/Aoody743/HunterCore/tree/main/third-party/hunt-engine
legacy_hunterassets:
  # Compatibility roots are a notice-and-browser forwarder only. They do not expose old
  # administrative subcommands or a second resource-pack lifecycle.
  enable: true
  permission: ''
  usage:
    - /hunterassets
    - /ha
    - /hassets

