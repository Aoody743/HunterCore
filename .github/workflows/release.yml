name: Release HunterCore

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v2.9.16-fixed or v2.9.16-fixed-build.42
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: huntercore-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION_INPUT: ${{ github.event.inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Restore verified bundled plugin cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/huntercore/bundled-plugin-artifacts
          key: ${{ runner.os }}-huntercore-bundled-plugin-artifacts-${{ hashFiles('scripts/prepare-bundled-plugins.sh') }}
          restore-keys: |
            ${{ runner.os }}-huntercore-bundled-plugin-artifacts-

      - name: Configure Git and Gradle
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"
          chmod +x gradlew
          chmod +x scripts/prepare-bundled-plugins.sh
          chmod +x scripts/verify-hunt-engine-vendor.sh
          chmod +x third-party/hunt-engine/gradlew

      - name: Verify vendored HuntEngine source
        run: bash scripts/verify-hunt-engine-vendor.sh

      - name: Build HuntEngine independently
        run: |
          (cd third-party/hunt-engine && ./gradlew assembleHuntEngine --stacktrace --no-daemon)
          bash scripts/verify-hunt-engine-vendor.sh third-party/hunt-engine/target/HuntEngine.jar

      - name: Validate release tag and source
        id: release
        run: |
          set -euo pipefail
          tag="${RELEASE_VERSION_INPUT:-${GITHUB_REF_NAME}}"
          if [ -z "$tag" ]; then
            echo "Release tag is empty" >&2
            exit 1
          fi
          expected_version="$(grep '^huntercoreVersion=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          exact_tag="v${expected_version}"
          build_tag_regex="^v${expected_version//./\\.}-build\\.([0-9]+)$"
          if [[ "$tag" == "$exact_tag" ]]; then
            huntercore_build="$(grep '^huntercoreBuildNumber=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          elif [[ "$tag" =~ $build_tag_regex ]]; then
            huntercore_build="${BASH_REMATCH[1]}"
          else
            echo "Expected $exact_tag or $exact_tag-build.<number>, got $tag" >&2
            exit 1
          fi
          version_label="$expected_version-build.$huntercore_build"
          mc_version="$(grep '^mcVersion=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          release_channel="$(grep '^releaseChannel=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          jar_name="HunterCore-$version_label-MinecraftServer-$mc_version-$release_channel.jar"
          web_name="HunterCore-$version_label-WebPanel-$mc_version-$release_channel.zip"
          {
            echo "tag=$tag"
            echo "version=$expected_version"
            echo "huntercore_build=$huntercore_build"
            echo "version_label=$version_label"
            echo "jar_name=$jar_name"
            echo "web_name=$web_name"
          } >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --no-tags origin '+refs/heads/codex/mc-26.2-experimental:refs/remotes/origin/codex/mc-26.2-experimental' || true
          git fetch --no-tags origin '+refs/heads/codex/v2.9.16-release:refs/remotes/origin/codex/v2.9.16-release' || true
          git fetch --no-tags origin '+refs/heads/codex/v2.9.16-fixed:refs/remotes/origin/codex/v2.9.16-fixed' || true
          allowed_source=false
          for branch in origin/main origin/codex/mc-26.2-experimental origin/codex/v2.9.16-release origin/codex/v2.9.16-fixed; do
            if git rev-parse --verify "$branch^{commit}" >/dev/null 2>&1 && git merge-base --is-ancestor "$GITHUB_SHA" "$branch"; then
              allowed_source=true
              break
            fi
          done
          if [ "$allowed_source" != true ]; then
            echo "Release commit $GITHUB_SHA is not contained in an allowed release branch" >&2
            exit 1
          fi

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace --no-daemon

      - name: Run targeted HunterCore checks
        run: |
          ./gradlew :divinemc-api:test --stacktrace --no-daemon
          ./gradlew :huntercore-plugins:hunter-auth:test --stacktrace --no-daemon
          ./gradlew :huntercore-plugins:hunter-tools:test --stacktrace --no-daemon
          ./gradlew :huntercore-plugins:hunter-tpa:test --stacktrace --no-daemon
          ./gradlew :huntercore-network-common:test :huntercore-network-bungee:compileJava :huntercore-network-velocity:compileJava --stacktrace --no-daemon
          ./gradlew :divinemc-server:compileJava --stacktrace --no-daemon

      - name: Build HunterCore release assets
        env:
          RELEASE_BUILD_NUMBER: ${{ steps.release.outputs.huntercore_build }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="$RELEASE_BUILD_NUMBER" ./gradlew packageHunterCoreRelease packageHunterCoreWebPanel verifyHunterCoreRelease :huntercore-network-bungee:jar :huntercore-network-velocity:jar --stacktrace --no-daemon --no-configuration-cache

      - name: Cold-start packaged HunterCore
        env:
          RELEASE_JAR_NAME: ${{ steps.release.outputs.jar_name }}
        run: bash scripts/smoke-test-release.sh "build/huntercore-release/$RELEASE_JAR_NAME"

      - name: Prepare release assets
        id: assets
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_BUILD_NUMBER: ${{ steps.release.outputs.huntercore_build }}
          RELEASE_VERSION_LABEL: ${{ steps.release.outputs.version_label }}
          RELEASE_JAR_NAME: ${{ steps.release.outputs.jar_name }}
          RELEASE_WEB_NAME: ${{ steps.release.outputs.web_name }}
        run: |
          set -euo pipefail
          out="build/huntercore-release"
          mkdir -p "$out"
          jar_name="$RELEASE_JAR_NAME"
          web_name="$RELEASE_WEB_NAME"
          bungee_name="HunterCore-${RELEASE_VERSION_LABEL}-Network-Bungee.jar"
          velocity_name="HunterCore-${RELEASE_VERSION_LABEL}-Network-Velocity.jar"
          test -f "$out/${jar_name}"
          test -f "$out/${web_name}"
          cp "huntercore-network-bungee/build/libs/HunterCore-Network-Bungee-${{ steps.release.outputs.version }}.jar" "$out/$bungee_name"
          cp "huntercore-network-velocity/build/libs/HunterCore-Network-Velocity-${{ steps.release.outputs.version }}.jar" "$out/$velocity_name"
          (cd "$out" && sha256sum "$jar_name" "$web_name" "$bungee_name" "$velocity_name" > SHA256SUMS.txt)
          {
            echo "out=$out"
          } >> "$GITHUB_OUTPUT"
          cat > "$out/RELEASE_NOTES.md" <<EOF
          HunterCore ${RELEASE_TAG} (${RELEASE_VERSION_LABEL})

          Built from commit ${GITHUB_SHA}, build ${RELEASE_BUILD_NUMBER}.

          Highlights:
          - HuntEngine 26.7.3 Community Edition fork, integrated as the HunterCore custom-content engine with GPLv3 source and notices.
          - HuntEngine content-pack workspace, catalogue, validation, publishing, migration diagnostics, and role-scoped WebPanel controls.
          - Unified HuntEngine catalogue GUI and HunterAuth resource-pack ownership with classic-GUI fallback.
          - Optimized web panel layout with Settings / Access / AI / Admin pages and in-page category navigation.
          - Unified command system around /hc, /hplayer, and /hnpc with Chinese/English help and language switching.
          - HunterAuth web registration/login, TPA/Home commands, and clickable teleport accept/deny chat UI.
          - Hybrid direct, BungeeCord, and Velocity ingress with per-connection HunterAuth bypass, SkinsRestorer application, network-aware Tab lists, and group chat.
          - Optional BungeeCord and Velocity companion jars for multi-proxy player-list and chat synchronization.
          - DivineMC/Purpur 26.2 optimization refresh retaining C2ME, Lithium, Matter secure seed, regionized ticking, and Leaves protocols.
          - CoreProtect 24.0 restored and enabled by default with a persistent content-addressed build cache.
          - Rebased onto the official DivineMC 26.2 release with dynamic registry sizing, fixing the stale 35-entry attribute registry startup crash.
          - Web-editable MOTD, F3 server name, sidebar, TPS actionbar/subtitle text, and AI settings.
          - Common-native release jar keeping Linux/macOS/Windows x86_64/aarch64 native libraries.
          - Standalone WebPanel zip for separated frontend deployments with backend URL and optional API key connection.

          Assets:
          - ${jar_name}
          - ${web_name}
          - ${bungee_name}
          - ${velocity_name}
          - SHA256SUMS.txt
          EOF

      - name: Create or update GitHub release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_JAR_NAME: ${{ steps.release.outputs.jar_name }}
          RELEASE_WEB_NAME: ${{ steps.release.outputs.web_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          out="${{ steps.assets.outputs.out }}"
          assets=(
            "$out/$RELEASE_JAR_NAME"
            "$out/$RELEASE_WEB_NAME"
            "$out/HunterCore-${{ steps.release.outputs.version_label }}-Network-Bungee.jar"
            "$out/HunterCore-${{ steps.release.outputs.version_label }}-Network-Velocity.jar"
            "$out/SHA256SUMS.txt"
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$out/RELEASE_NOTES.md"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "HunterCore $tag" \
              --notes-file "$out/RELEASE_NOTES.md"
          fi
