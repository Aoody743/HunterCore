name: HunterAssets
main: org.huntercore.plugins.assets.HunterAssetsPlugin
version: ${version}
api-version: '1.21'
authors: [HunterCore]
description: Lightweight HunterCore custom resource-pack and custom item support.
commands:
  hunterassets:
    description: Manage HunterAssets.
    aliases: [ha, hassets]
    usage: /hunterassets <gui|reload|list|give|sendpack>
permissions:
  hunterassets.use:
    default: true
  hunterassets.admin:
    default: op
  hunterassets.give:
    default: op
